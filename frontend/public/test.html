<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 테스트</title>
</head>
<body>
    <h1>기본 HTML 테스트</h1>
    <p>이 텍스트가 보인다면 HTML이 작동 중입니다.</p>
    <div style="background-color: red; color: white; padding: 20px; margin: 20px;">
        빨간 배경이 보인다면 CSS가 작동 중입니다.
    </div>
    <div style="background-color: blue; color: white; padding: 20px; margin: 20px;">
        파란 배경이 보인다면 인라인 스타일이 작동 중입니다.
    </div>
    <button style="background-color: green; color: white; padding: 10px 20px; border: none; cursor: pointer;">
        초록 버튼
    </button>
</body>
</html>
